<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>OPM — Operations Personnel Monitor</title>
<link rel="manifest" href="opm-manifest.json">
<meta name="theme-color" content="#00e5ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="opm-core.css">
<style>
body{height:100vh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg-base);}
.tab-bar{display:flex;background:var(--bg-panel);border-bottom:1px solid var(--border-color);flex-shrink:0;align-items:center;justify-content:space-between;padding:0 12px;height:44px;}
.tab-left{display:flex;align-items:center;gap:2px;height:100%;}
.tab-btn{background:none;border:none;color:var(--text-dim);font-family:var(--font-mono);font-size:10px;letter-spacing:1px;padding:0 16px;cursor:pointer;height:100%;transition:all var(--transition);font-weight:600;border-bottom:2px solid transparent;}
.tab-btn:hover{color:var(--accent);}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);background:var(--accent-dim);}
.tab-right{display:flex;align-items:center;gap:6px;}
.tab-badge{display:inline-flex;align-items:center;gap:4px;background:var(--accent);color:#000;font-family:var(--font-mono);font-size:8px;font-weight:700;padding:2px 8px;letter-spacing:1px;border-radius:2px;}
.tab-content{flex:1;overflow:hidden;position:relative;}
.tab-content iframe{width:100%;height:100%;border:none;display:none;}
.tab-content iframe.active{display:block;}
.loading-overlay{position:absolute;inset:0;background:var(--bg-base);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:13px;color:var(--text-dim);z-index:10;gap:12px;}
.spinner{width:36px;height:36px;border:3px solid var(--border-color);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="tab-bar">
  <div class="tab-left">
    <button class="tab-btn active" id="tab-commander" onclick="switchTab('commander')">🗺️ COMMANDER</button>
    <button class="tab-btn" id="tab-dashboard" onclick="switchTab('dashboard')">📊 DASHBOARD</button>
  </div>
  <div class="tab-right"><span class="tab-badge">OPM</span></div>
</div>
<div class="tab-content">
  <div id="loading-overlay" class="loading-overlay"><div class="spinner"></div><div id="loading-text">Loading...</div></div>
  <iframe id="iframe-commander"></iframe>
  <iframe id="iframe-dashboard"></iframe>
</div>
<script>
var loaded={commander:false,dashboard:false};
var timer=null;

document.getElementById('iframe-commander').addEventListener('load',function(){
  loaded.commander=true;hideSpinner();
});
document.getElementById('iframe-dashboard').addEventListener('load',function(){
  loaded.dashboard=true;hideSpinner();
});

function hideSpinner(){
  document.getElementById('loading-overlay').style.display='none';
  if(timer){clearTimeout(timer);timer=null;}
}

function loadTab(name){
  document.getElementById('tab-commander').classList.toggle('active',name==='commander');
  document.getElementById('tab-dashboard').classList.toggle('active',name==='dashboard');
  var frame=document.getElementById('iframe-'+name);
  var other=document.getElementById('iframe-'+(name==='commander'?'dashboard':'commander'));
  frame.classList.add('active');
  other.classList.remove('active');
  if(!loaded[name]){
    frame.src=name+'.html';
    document.getElementById('loading-overlay').style.display='flex';
    document.getElementById('loading-text').textContent='Loading '+(name==='commander'?'Commander':'Dashboard')+'...';
    timer=setTimeout(function(){document.getElementById('loading-overlay').style.display='none';},25000);
  }else{
    document.getElementById('loading-overlay').style.display='none';
  }
  localStorage.setItem('opm_active_tab',name);
}
function switchTab(name){loadTab(name);}

// Start Commander immediately. Dashboard loads after Commander has config.
loadTab('commander');

var _dashLoading = false;
function tryLoadDash(){
  if(_dashLoading) return;
  try{
    var raw = localStorage.getItem('opm_config_v2') || localStorage.getItem('tms_config');
    var cfg = JSON.parse(raw||'{}');
    if(cfg && cfg.sheetUrl && cfg.teams && Array.isArray(cfg.teams) && cfg.teams.length){
      _dashLoading = true;
      document.getElementById('iframe-dashboard').src = 'dashboard.html';
      loaded.dashboard = true;
    } else {
      setTimeout(tryLoadDash, 1500);
    }
  }catch(e){ setTimeout(tryLoadDash, 1500); }
}
setTimeout(tryLoadDash, 3000);
</script>
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/v4513226cdae34746b4dedf0b4dfa099e1781791509496" integrity="sha512-ZE9pZaUXND66v380QUtch/5sE9tPFh2zg45pR2PB0CVkCtOREv2AJKkSidISWkysEuQ0EH8faUU5du78bx87UQ==" data-cf-beacon='{"version":"2024.11.0","token":"1954b47c125f43f8b4338b3c4f804e4f"}' crossorigin="anonymous"></script>
</body>
</html>
