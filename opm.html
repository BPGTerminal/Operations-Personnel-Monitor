<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>OPM — Operations Personnel Monitor</title>

<link rel="manifest" href="opm-manifest.json">
<meta name="theme-color" content="#00e5ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="opm-core.css">

<style>
body {
  height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  background: var(--bg-base);
}

/* Tab bar */
.tab-bar {
  display: flex; background: var(--bg-panel); border-bottom: 1px solid var(--border-color);
  flex-shrink: 0; align-items: center; justify-content: space-between; padding: 0 12px;
  height: 44px;
}
.tab-left {
  display: flex; align-items: center; gap: 2px; height: 100%;
}
.tab-btn {
  background: none; border: none; color: var(--text-dim);
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 1px;
  padding: 0 16px; cursor: pointer; height: 100%;
  transition: all var(--transition); font-weight: 600;
  border-bottom: 2px solid transparent;
}
.tab-btn:hover { color: var(--accent); }
.tab-btn.active {
  color: var(--accent); border-bottom-color: var(--accent);
  background: var(--accent-dim);
}
.tab-right {
  display: flex; align-items: center; gap: 6px;
}

.tab-badge {
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--accent); color: #000;
  font-family: var(--font-mono); font-size: 8px; font-weight: 700;
  padding: 2px 8px; letter-spacing: 1px; border-radius: 2px;
}

/* Iframe container */
.tab-content {
  flex: 1; overflow: hidden; position: relative;
}
.tab-content iframe {
  width: 100%; height: 100%; border: none; display: none;
}
.tab-content iframe.active { display: block; }

/* Loading overlay */
.loading-overlay {
  position: absolute; inset: 0; background: var(--bg-base);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: 12px; color: var(--text-dim);
  z-index: 10;
}
</style>
</head>
<body>

<div class="tab-bar">
  <div class="tab-left">
    <button class="tab-btn active" id="tab-commander" onclick="switchTab('commander')">
      🗺️ COMMANDER
    </button>
    <button class="tab-btn" id="tab-dashboard" onclick="switchTab('dashboard')">
      📊 DASHBOARD
    </button>
  </div>
  <div class="tab-right">
    <span id="loading-indicator" style="display:none;font-family:var(--font-mono);font-size:9px;color:var(--accent);">Loading...</span>
    <span class="tab-badge">OPM</span>
  </div>
</div>

<div class="tab-content">
  <div id="loading-overlay-cmd" class="loading-overlay">🗺️ Loading Commander...</div>
  <div id="loading-overlay-dash" class="loading-overlay" style="display:none;">📊 Loading Dashboard...</div>
  <iframe id="iframe-commander" src="commander.html" class="active" onload="hideLoading('cmd')" onerror="hideLoading('cmd')"></iframe>
  <iframe id="iframe-dashboard" src="dashboard.html" onload="hideLoading('dash')" onerror="hideLoading('dash')"></iframe>
</div>

<script>
function switchTab(name) {
  // Update tab buttons
  document.getElementById('tab-commander').classList.toggle('active', name === 'commander');
  document.getElementById('tab-dashboard').classList.toggle('active', name === 'dashboard');

  // Show correct iframe + loading
  var cmdFrame = document.getElementById('iframe-commander');
  var dashFrame = document.getElementById('iframe-dashboard');
  var cmdLoad = document.getElementById('loading-overlay-cmd');
  var dashLoad = document.getElementById('loading-overlay-dash');

  cmdFrame.classList.toggle('active', name === 'commander');
  dashFrame.classList.toggle('active', name === 'dashboard');

  if (name === 'commander') {
    cmdLoad.style.display = 'flex';
    // Reload if never loaded
    if (!cmdFrame.src || cmdFrame.contentDocument.readyState === 'complete') {
      // Already loaded, just show
    }
  } else {
    dashLoad.style.display = 'flex';
  }

  // Save preference
  localStorage.setItem('opm_active_tab', name);
}

function hideLoading(which) {
  document.getElementById('loading-overlay-' + which).style.display = 'none';
  document.getElementById('loading-indicator').style.display = 'none';
}

// Restore last active tab
(function() {
  var saved = localStorage.getItem('opm_active_tab') || 'commander';
  switchTab(saved);
})();
</script>

</body>
</html>
