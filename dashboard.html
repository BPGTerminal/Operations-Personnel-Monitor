<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPM — Report</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#00e5ff">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="opm-core.css">
<style>
body{min-height:100vh;display:flex;flex-direction:column;overflow-y:auto;background:#060b14}
.bar{background:#0c1526;border-bottom:1px solid #1e3260;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:100}
.bar label{font-family:'Share Tech Mono',monospace;font-size:10px;color:#6a80b0;letter-spacing:1px}
.bar select,.bar input{background:rgba(0,0,0,.4);border:1px solid #1e3260;color:#fff;font-family:'Share Tech Mono',monospace;font-size:10px;padding:6px 10px;border-radius:3px;outline:none}
.bar button{background:rgba(255,255,255,.04);border:1px solid #1e3260;color:#c8d8e8;font-family:'Share Tech Mono',monospace;font-size:10px;padding:6px 14px;cursor:pointer;border-radius:3px;letter-spacing:.5px}
.bar button:hover{border-color:#00e5ff;color:#00e5ff;background:rgba(0,229,255,.1)}
.bar .btn-green{background:rgba(0,255,136,.1);border-color:#00ff88;color:#00ff88}
.bar a{color:#6a80b0;text-decoration:none;font-family:'Share Tech Mono',monospace;font-size:10px;padding:6px 10px;border:1px solid #1e3260;border-radius:3px}
.content{max-width:1100px;width:100%;margin:0 auto;padding:20px}
.card{background:#0c1526;border:1px solid #1e3260;border-radius:6px;margin-bottom:16px;overflow:hidden}
.card-hdr{background:rgba(0,229,255,.08);padding:12px 20px;font-family:'Share Tech Mono',monospace;font-size:10px;color:#00e5ff;letter-spacing:2px;font-weight:700;border-bottom:1px solid #1e3260}
.card-body{padding:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:#1e3260;border-radius:6px;overflow:hidden}
.stats div{background:#0c1526;padding:18px;text-align:center}
.stats .n{font-family:'Share Tech Mono',monospace;font-size:28px;font-weight:700;color:#00e5ff}
.stats .l{font-family:'Share Tech Mono',monospace;font-size:8px;color:#6a80b0;letter-spacing:1px;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:rgba(0,0,0,.3);color:#00e5ff;font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:1px;padding:10px 14px;text-align:left;border-bottom:1px solid #1e3260}
td{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.04);color:#c8d8e8}
.msg{max-height:400px;overflow-y:auto;font-size:11px}
.mr{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.mt{font-family:'Share Tech Mono',monospace;color:#6a80b0;min-width:80px;font-size:9px}
.ms{color:#00e5ff;font-weight:600;min-width:100px}
.mb{flex:1}
.empty{text-align:center;padding:40px;color:#6a80b0;font-family:'Share Tech Mono',monospace;font-size:12px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.pc{background:rgba(255,255,255,.04);border:1px solid #1e3260;border-radius:6px;overflow:hidden}
.pc img{width:100%;height:200px;object-fit:cover;display:block}
.pc .pi{padding:12px;color:#c8d8e8;font-size:13px}
</style>
</head>
<body>
<div class="bar">
<label>UNIT:</label><select id="unit" onchange="load()"><option value="">ALL UNITS</option></select>
<span style="color:#6a80b0;margin:0 4px">|</span>
<label>FROM:</label><input type="date" id="from" onchange="load()">
<label>TO:</label><input type="date" id="to" onchange="load()">
<button onclick="document.getElementById('from').value='';document.getElementById('to').value='';load()">ALL</button>
<button class="btn-green" onclick="td()">TODAY</button>
<button onclick="document.getElementById('from').value=r(7);document.getElementById('to').value=r(0);load()">WEEK</button>
<span style="flex:1"></span>
<button onclick="window.print()">PRINT</button>
<button onclick="load()">REFRESH</button>
<a href="commander.html">COMMANDER</a>
<a href="admin.html">ADMIN</a>
</div>
<div class="content" id="content"><div class="card"><div class="card-body empty">Loading...</div></div></div>
<script src="opm-core.js"></script>
<script>
var c=null;

function r(n){var d=new Date();d.setDate(d.getDate()-n);return d.toISOString().substring(0,10)}
function td(){document.getElementById('from').value=r(0);document.getElementById('to').value=r(0);load()}

function cfg(){
  try{var x=localStorage.getItem('opm_config_v2')||localStorage.getItem('tms_config');var y=x?JSON.parse(x):{};return(y&&y.sheetUrl&&y.teams&&Array.isArray(y.teams)&&y.teams.length)?y:null}catch(e){return null}
}

function pu(){
  var f=cfg()||{};var t=Array.isArray(f.teams)?f.teams:[];
  var s=document.getElementById('unit');s.innerHTML='<option value="">ALL UNITS</option>';
  t.forEach(function(v){var o=document.createElement('option');o.value=v.name;o.textContent=v.name;s.appendChild(o)});
}

function esc(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

async function fetchData(){
  var url=OPM.SHEET_URL();if(!url)return null;
  var fr=document.getElementById('from').value,to=document.getElementById('to').value;
  try{var p=new URLSearchParams({action:'getDashboardData',t:Date.now()});
  if(fr)p.set('dateFrom',fr+' 00:00:00');if(to)p.set('dateTo',to+' 23:59:59');
  var res=await fetch(url+'?'+p,{cache:'no-store'});return await res.json()}catch(e){return null}
}

async function load(){
  pu();var f=cfg();
  if(!f){document.getElementById('content').innerHTML='<div class="card"><div class="card-body empty">No backend configured. Open Admin page to set up.</div></div>';return}
  OPM.saveConfig(f);
  document.getElementById('content').innerHTML='<div class="card"><div class="card-body empty">Loading report...</div></div>';
  var data=await fetchData();if(!data||!data.summary||(data.summary.totalMessages===0&&data.summary.totalPersonnel===0)){document.getElementById('content').innerHTML='<div class="card"><div class="card-body empty">No data for this period.</div></div>';return}
  var s=data.summary;var ud=Array.isArray(data.unitData)?data.unitData:[];var photos=data.photos||[];var all=data.allMessages||[];var pt=data.personnelByTeam||{};
  var su=document.getElementById('unit').value||'ALL UNITS';
  if(su!=='ALL UNITS'){ud=ud.filter(function(u){return u.team===su});photos=photos.filter(function(p){return p.team===su});all=all.filter(function(m){return m.team===su})}
  var tm=ud.reduce(function(a,u){return a+(u.messages||0)},0),tt=ud.reduce(function(a,u){return a+(u.tasks||0)},0),ti=ud.reduce(function(a,u){return a+(u.incidents||0)},0),tp=ud.reduce(function(a,u){return a+(u.photos||0)},0);
  var co=['#00e5ff','#00ff88','#ff6b35','#ffd166','#a29bfe','#fd79a8','#55efc4'];
  var h='';

  // Stats
  h+='<div class="card"><div class="card-hdr">EXECUTIVE SUMMARY</div><div class="card-body"><div class="stats">';
  h+='<div><div class="n">'+tm+'</div><div class="l">Messages</div></div>';
  h+='<div><div class="n" style="color:#00ff88">'+tt+'</div><div class="l">Tasks</div></div>';
  h+='<div><div class="n">'+tp+'</div><div class="l">Photos</div></div>';
  h+='<div><div class="n" style="color:#ffaa00">'+ti+'</div><div class="l">Incidents</div></div>';
  h+='<div><div class="n">'+s.totalPersonnel+'</div><div class="l">Personnel</div></div>';
  h+='<div><div class="n" style="color:#00ff88">'+s.onlineNow+'</div><div class="l">Online</div></div>';
  h+='</div></div></div>';

  // Unit table
  if(ud.length>0){
    h+='<div class="card"><div class="card-hdr">UNIT PERFORMANCE</div><div class="card-body"><table><tr><th></th><th>UNIT</th><th style="text-align:center">PHOTOS</th><th style="text-align:center">TASKS</th><th style="text-align:center">INC</th><th style="text-align:center">COMMS</th></tr>';
    ud.forEach(function(u,i){h+='<tr><td><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:'+co[i%7]+';margin-right:6px"></span></td><td><strong>'+esc(u.team)+'</strong></td><td style="text-align:center;font-family:monospace">'+(u.photos||0)+'</td><td style="text-align:center;font-family:monospace;color:#00ff88">'+(u.tasks||0)+'</td><td style="text-align:center;font-family:monospace;color:'+((u.incidents||0)>0?'#ffaa00':'#6a80b0')+'">'+(u.incidents||0)+'</td><td style="text-align:center;font-family:monospace">'+(u.messages||0)+'</td></tr>'});
    h+='</table></div></div>';
  }

  // Photos
  if(photos.length>0){
    h+='<div class="card"><div class="card-hdr">PHOTO REPORTS ('+photos.length+')</div><div class="card-body"><div class="photos">';
    photos.slice(0,12).forEach(function(p,i){
      var m=(p.url||'').match(/[?&]id=([a-zA-Z0-9_-]+)/);var e=m?'https://lh3.googleusercontent.com/d/'+m[1]:p.url;
      h+='<div class="pc"><img src="'+esc(e)+'" loading="lazy"><div class="pi"><strong>'+esc(p.team||'')+'</strong> &middot; '+esc(p.sender||'')+'<br>'+esc((p.body||p.description||'').substring(0,100))+'</div></div>'
    });
    h+='</div></div></div>';
  }

  // Messages
  if(all.length>0){
    h+='<div class="card"><div class="card-hdr">COMMUNICATIONS LOG ('+all.length+')</div><div class="card-body"><div class="msg">';
    all.slice().reverse().slice(0,60).forEach(function(m){h+='<div class="mr"><span class="mt">'+esc((m.time||'').substring(0,19))+'</span><span class="ms">'+esc(m.sender||'')+'</span><span class="mb">'+esc((m.body||'').substring(0,120))+'</span></div>'});
    h+='</div></div></div>';
  }

  document.getElementById('content').innerHTML=h;
}

document.addEventListener('DOMContentLoaded',function(){pu();if(cfg())td();else document.getElementById('content').innerHTML='<div class="card"><div class="card-body empty">Waiting for configuration...<br><br>Open Admin page to set up, then return here.</div></div>'});
</script>

</html>
