<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPM — Operations Report</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#00e5ff">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="opm-core.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
body{min-height:100vh;display:flex;flex-direction:column;overflow-y:auto;background:var(--bg-base)}
.header{text-align:center;padding:20px 20px 8px;background:var(--bg-panel);border-bottom:2px solid var(--accent)}
.header img{max-width:200px;max-height:80px}
.header h1{font-size:20px;font-weight:700;letter-spacing:3px;color:#fff;text-transform:uppercase;margin-top:8px}
.header .sub{font-family:var(--font-mono);font-size:9px;color:var(--accent);letter-spacing:2px}
.bar{background:var(--bg-panel);border-bottom:1px solid var(--border-color);padding:8px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:100}
.bar label{font-family:var(--font-mono);font-size:9px;color:var(--text-dim);letter-spacing:1px;white-space:nowrap}
.bar select,.bar input{background:var(--bg-surface);border:1px solid var(--border-color);color:#fff;font-family:var(--font-mono);font-size:10px;padding:5px 8px;border-radius:var(--radius);outline:none}
.content{max-width:1100px;width:100%;margin:0 auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--bg-panel);border:1px solid var(--border-color);border-radius:6px;overflow:hidden}
.card-hdr{background:var(--accent-dim);padding:11px 18px;font-family:var(--font-mono);font-size:9px;color:var(--accent);letter-spacing:2px;font-weight:700;border-bottom:1px solid var(--border-color);text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.card-body{padding:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--border-color);border-radius:6px;overflow:hidden}
.stats div{background:var(--bg-panel);padding:16px;text-align:center}
.stats .n{font-family:var(--font-mono);font-size:28px;font-weight:700;color:var(--accent)}
.stats .l{font-family:var(--font-mono);font-size:8px;color:var(--text-dim);letter-spacing:1px;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:var(--font-xs)}
th{background:rgba(0,0,0,.25);color:var(--accent);font-family:var(--font-mono);font-size:9px;letter-spacing:1px;padding:10px 14px;text-align:left;border-bottom:1px solid var(--border-color)}
td{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.04);color:var(--text-secondary)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.num{font-family:var(--font-mono);font-weight:700;text-align:center}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.photo-card{display:grid;grid-template-columns:1fr 1fr;background:var(--bg-surface);border:1px solid var(--border-color);border-radius:8px;overflow:hidden}
.photo-side{position:relative;min-height:260px;overflow:hidden;cursor:pointer;background:rgba(0,0,0,.3)}
.photo-side img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;transition:transform .3s}
.photo-side:hover img{transform:scale(1.03)}
.photo-side .pb{position:absolute;top:10px;left:10px;padding:3px 10px;border-radius:3px;font-family:var(--font-mono);font-size:8px;color:#000;z-index:2}
.photo-side .pn{position:absolute;top:10px;right:10px;background:var(--accent);color:#000;font-family:var(--font-mono);font-size:8px;font-weight:700;padding:3px 10px;border-radius:3px;z-index:2}
.info-side{padding:16px 20px;display:flex;flex-direction:column;gap:8px}
.info-side .fn{font-size:20px;font-weight:700;color:#fff;line-height:1.3}
.info-side .fr{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:var(--font-xs)}
.info-side .fk{font-family:var(--font-mono);color:var(--accent);font-size:9px;white-space:nowrap}
.info-side .fv{color:var(--text-dim)}
.info-side .fp{font-size:13px;color:var(--text-secondary);line-height:1.5;font-style:italic;padding-top:8px;border-top:1px solid rgba(255,255,255,.08)}
.inspect-block{border:2px solid var(--border-color);border-radius:8px;margin-bottom:14px;overflow:hidden}
.inspect-hdr{background:rgba(0,0,0,.3);padding:10px 16px;display:flex;justify-content:space-between;align-items:center}
.inspect-body{padding:14px 16px}
.inspect-sec{margin-bottom:10px}
.inspect-sec-title{font-family:var(--font-mono);font-size:9px;color:var(--accent);letter-spacing:1px;margin-bottom:6px;text-transform:uppercase}
.inspect-item{padding:7px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.inspect-item span{font-size:13px;color:var(--text-secondary)}
.inspect-photos{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;margin-left:22px}
.inspect-photos img{width:110px;height:82px;object-fit:cover;border-radius:4px;border:1px solid var(--border-color);cursor:pointer}
.inspect-remarks{margin-top:8px;padding:10px 12px;background:rgba(255,170,0,.06);border-left:3px solid var(--warning);border-radius:0 4px 4px 0}
.narrative-box{width:100%;min-height:160px;background:rgba(0,0,0,.3);border:1px solid var(--border-color);color:var(--text-primary);font-family:var(--font-sans);font-size:var(--font-sm);padding:14px;line-height:1.8;resize:vertical;border-radius:var(--radius);outline:none}
.narrative-box:focus{border-color:var(--accent)}
.msg-log{max-height:400px;overflow-y:auto;font-size:var(--font-xs)}
.mr{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.mt{font-family:var(--font-mono);color:var(--text-dim);min-width:80px;font-size:9px}
.ms{color:var(--accent);font-weight:600;min-width:110px}
.mb{flex:1;color:var(--text-secondary)}
.empty{text-align:center;padding:40px;color:var(--text-dim);font-family:var(--font-mono);font-size:12px}
.footer{text-align:center;padding:16px 0 24px;font-family:var(--font-mono);opacity:.7}
.footer .ft{font-size:9px;color:var(--accent);letter-spacing:2px}
.footer .fs{font-size:8px;color:var(--text-dim);margin-top:4px}
@media(max-width:768px){.photo-card{grid-template-columns:1fr!important}}
@media print{body{background:#fff!important;color:#000!important;overflow:visible!important}.bar,.btn,.footer{display:none!important}.header{border-bottom-color:#1a4d8f!important}.content{padding:10px!important;max-width:none!important}.card,.card-body{background:#fff!important;border-color:#ccc!important;break-inside:avoid}.card-hdr{color:#1a4d8f!important;background:#f0f4f8!important}.photo-card{border:1px solid #ccc!important;break-inside:avoid}.stats div{background:#f0f4f8!important;border-color:#ccc!important}.n,.fn,.ms{color:#1a4d8f!important}*{text-shadow:none!important;box-shadow:none!important}}
</style>
</head>
<body>
<div class="header"><img src="bpgt-logo.png" alt="BPGT"><h1 id="cover-title">Operations Report</h1><div class="sub" id="cover-sub">BROOKE'S POINT GOVERNMENT TERMINAL</div></div>
<div class="bar">
<label>UNIT:</label><select id="unit" onchange="R()"><option value="">ALL UNITS</option></select>
<span style="color:var(--text-dim);margin:0 6px">|</span>
<label>FROM:</label><input type="date" id="from" onchange="R()">
<label>TO:</label><input type="date" id="to" onchange="R()">
<button class="btn btn-sm" onclick="document.getElementById('from').value='';document.getElementById('to').value='';R()">ALL</button>
<button class="btn btn-sm btn-success" onclick="T()">TODAY</button>
<button class="btn btn-sm btn-warning" onclick="W()">WEEK</button>
<span style="flex:1"></span>
<button class="btn btn-sm" onclick="window.print()">PRINT</button>
<button class="btn btn-primary btn-sm" onclick="R()">REFRESH</button>
<a class="btn btn-sm" href="commander.html">COMMANDER</a>
<a class="btn btn-sm" href="admin.html">ADMIN</a>
</div>
<div class="content" id="content"><div class="card"><div class="card-body empty">Loading report...</div></div></div>
<div class="footer"><div class="ft">-=pagong=-</div><div class="fs">JOEY SABENACIO HEREDERO &nbsp;&middot;&nbsp; OPM &middot; OPERATIONS PERSONNEL MONITOR &nbsp;&middot;&nbsp; &copy; 2026</div></div>
<script src="opm-core.js"></script>
<script>

var _chart=null;
var _narOrig='';
var CO=['#00e5ff','#00ff88','#ff6b35','#ffd166','#a29bfe','#fd79a8','#55efc4'];

function esc(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtD(v){return String(v||'').replace('T',' ');}
function exL(b,l){if(!b)return'';var m=b.match(new RegExp(l+':\\s*(.+?)(?:\\n|$)','i'));return m?m[1].trim():'';}
function pD(p){return p.photoDesc||p.description||exL(p.body,'Description')||'Photo report';}
function pW(p){return p.photoWhere||exL(p.body,'Where')||p.post||'';}
function pY(p){return p.photoWhy||exL(p.body,'Why/Purpose')||exL(p.body,'Why')||'';}
function pC(p){return p.captureTime||exL(p.body,'Captured')||p.time||'';}

function G(){
  try{var r=localStorage.getItem('opm_config_v2')||localStorage.getItem('tms_config');var c=r?JSON.parse(r):{};return(c&&c.sheetUrl&&c.teams&&Array.isArray(c.teams)&&c.teams.length)?c:null}catch(e){return null}
}

function PU(){
  var cfg=G()||{};var t=Array.isArray(cfg.teams)?cfg.teams:[];
  var s=document.getElementById('unit');if(!s)return;
  s.innerHTML='<option value="">ALL UNITS</option>';
  t.forEach(function(v){var o=document.createElement('option');o.value=v.name;o.textContent=v.name;s.appendChild(o)});
}

function T(){var d=new Date().toISOString().substring(0,10);document.getElementById('from').value=d;document.getElementById('to').value=d;R()}
function W(){var n=new Date(),day=n.getDay();var m=new Date(n);m.setDate(n.getDate()-(day===0?6:day-1));var s=new Date(m);s.setDate(m.getDate()+6);document.getElementById('from').value=m.toISOString().substring(0,10);document.getElementById('to').value=s.toISOString().substring(0,10);R()}

async function Q(){
  var url=OPM.SHEET_URL();if(!url)return null;
  var fr=document.getElementById('from').value,to=document.getElementById('to').value;
  try{var p=new URLSearchParams({action:'getDashboardData',t:Date.now()});if(fr)p.set('dateFrom',fr+' 00:00:00');if(to)p.set('dateTo',to+' 23:59:59');var r=await fetch(url+'?'+p,{cache:'no-store'});return await r.json()}catch(e){return null}
}

async function R(){
  PU();var cfg=G();
  if(!cfg){document.getElementById('content').innerHTML='<div class="card"><div class="card-body empty">No backend configured.<br><br>Open <a href="admin.html" style="color:var(--accent)">Admin page</a> and save settings first.</div></div>';return}
  OPM.saveConfig(cfg);if(_chart){_chart.destroy();_chart=null}
  document.getElementById('content').innerHTML='<div class="card"><div class="card-body empty">Loading report...</div></div>';
  var data=await Q();
  var su=document.getElementById('unit').value||'ALL UNITS',df=document.getElementById('from').value||'beginning',dt=document.getElementById('to').value||'present';
  var c2=OPM.getConfig();document.getElementById('cover-title').textContent=(c2.eventName||'Operations Report');document.getElementById('cover-sub').textContent=(c2.location||'BROOKE\'S POINT GOVERNMENT TERMINAL');
  if(!data||!data.summary||(data.summary.totalMessages===0&&data.summary.totalPersonnel===0)){document.getElementById('content').innerHTML='<div class="card"><div class="card-body empty">No data for <strong>'+esc(su)+'</strong> from <strong>'+esc(df)+'</strong> to <strong>'+esc(dt)+'</strong><br><br><button class="btn btn-sm" onclick="T()">TODAY</button> <button class="btn btn-sm" onclick="R()">ALL TIME</button></div></div>';return}
  B(data,su,df,dt)
}

function B(data,su,df,dt){
  var s=data.summary;var ud=Array.isArray(data.unitData)?data.unitData:[];var photos=data.photos||[];var all=data.allMessages||[];var pt=data.personnelByTeam||{};
  if(su!=='ALL UNITS'){ud=ud.filter(function(u){return u.team===su});photos=photos.filter(function(p){return p.team===su});all=all.filter(function(m){return m.team===su});var fp={};if(pt[su])fp[su]=pt[su];pt=fp}
  var tm=ud.reduce(function(a,u){return a+(u.messages||0)},0),tt=ud.reduce(function(a,u){return a+(u.tasks||0)},0),ti=ud.reduce(function(a,u){return a+(u.incidents||0)},0),tp=ud.reduce(function(a,u){return a+(u.photos||0)},0);
  var un=ud.map(function(u){return u.team}),ut=ud.map(function(u){return u.tasks||0}),up=ud.map(function(u){return u.photos||0});

  var h='';
  // EXECUTIVE SUMMARY
  var pers=(su!=='ALL UNITS'?(pt[su]||0):s.totalPersonnel),actv=(su!=='ALL UNITS'?(pt[su]||0):s.onlineNow);
  h+=C('EXECUTIVE SUMMARY','',S(tm,tt,tp,ti,pers,actv));

  // UNIT TABLE
  if(un.length>0){h+=C('UNIT PERFORMANCE','PERIOD: '+esc(df)+' '+esc(dt),UT(ud,un));}

  // PHOTO GALLERY
  if(photos.length>0){h+=PG(photos,un);}

  // INSPECTION REPORTS
  var insp=all.filter(function(m){return m.type==='inspection'});
  if(insp.length>0){h+=IR(insp,df);}

  // NARRATIVE
  var nar=esc('PERIOD: '+df+' to '+dt+' | UNIT: '+su+'\n\nDuring this period, '+tm+' communications were recorded. '+tt+' tasks accomplished, '+tp+' photo reports submitted, and '+ti+' incidents logged.\n\nGenerated by OPM on '+OPM.formatDateTime()+'.');
  h+=C('NARRATIVE','<span style="font-size:8px;color:var(--text-dim)">EDITABLE</span>','<textarea class="narrative-box" id="nar-text">'+nar+'</textarea><div class="flex gap-sm" style="margin-top:10px"><button class="btn btn-success btn-sm" onclick="SN()">SAVE</button><button class="btn btn-sm" onclick="RN()">RESET</button><span id="nar-ok" style="display:none;font-family:var(--font-mono);font-size:10px;color:var(--success)">SAVED</span></div>');

  // COMMS LOG
  if(all.length>0){h+=CL(all);}

  document.getElementById('content').innerHTML=h;

  // Chart
  if(un.length>0){setTimeout(function(){var cv=document.getElementById('chart');if(cv){_chart=new Chart(cv,{type:'bar',data:{labels:un,datasets:[{label:'Photos',data:up,backgroundColor:CO.slice(0,un.length),borderWidth:0,borderRadius:3},{label:'Tasks',data:ut,backgroundColor:CO.slice(0,un.length).map(function(x){return x+'44'}),borderWidth:0,borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#6a80b0',font:{family:'Share Tech Mono',size:10}}}},scales:{x:{ticks:{color:'#6a80b0',font:{size:9},maxRotation:45},grid:{color:'#1e326020'}},y:{ticks:{color:'#6a80b0',font:{size:9}},grid:{color:'#1e326030'},beginAtZero:true}}})}},300)}

  // Narrative restore
  var nt=document.getElementById('nar-text');if(nt){_narOrig=nt.value;var key='nar_'+su.replace(/[^a-z0-9]/gi,'_')+'_'+(df||'any')+'_'+(dt||'any');var c3=OPM.getConfig();if(c3&&c3[key])nt.value=c3[key]}
}

}

// ── HTML BUILDERS ──
function C(hdr,sub,body){return '<div class="card"><div class="card-hdr">'+hdr+' '+sub+'</div><div class="card-body">'+body+'</div></div>';}
function S(m,tt,tp,ti,p,a){return '<div class="stats"><div><div class="n">'+m+'</div><div class="l">Messages</div></div><div><div class="n" style="color:var(--success)">'+tt+'</div><div class="l">Tasks</div></div><div><div class="n">'+tp+'</div><div class="l">Photos</div></div><div><div class="n" style="color:var(--warning)">'+ti+'</div><div class="l">Incidents</div></div><div><div class="n">'+p+'</div><div class="l">Personnel</div></div><div><div class="n" style="color:var(--success)">'+a+'</div><div class="l">Online</div></div></div>';}
function UT(ud,un){var h='<table><tr><th></th><th>UNIT</th><th class="num">PHOTOS</th><th class="num">TASKS</th><th class="num">INC</th><th class="num">COMMS</th></tr>';ud.forEach(function(u,i){h+='<tr><td><span class="dot" style="background:'+CO[i%7]+'"></span></td><td><strong>'+esc(u.team)+'</strong></td><td class="num">'+(u.photos||0)+'</td><td class="num" style="color:var(--success)">'+(u.tasks||0)+'</td><td class="num" style="color:'+((u.incidents||0)>0?'var(--warning)':'var(--text-dim)')+'">'+(u.incidents||0)+'</td><td class="num">'+(u.messages||0)+'</td></tr>'});h+='</table><div style="margin-top:14px;height:200px"><canvas id="chart"></canvas></div>';return h;}

function PG(photos,un){
  var h='<div class="card"><div class="card-hdr">PHOTO REPORTS ('+photos.length+')</div><div class="card-body"><div class="photo-grid">';
  photos.slice(0,20).forEach(function(p,i){
    var m=(p.url||'').match(/[?&]id=([a-zA-Z0-9_-]+)/);var e=m?'https://lh3.googleusercontent.com/d/'+m[1]:p.url;
    var uc=CO[un.indexOf(p.team)%7]||'var(--accent)';
    var desc=pD(p),where=pW(p),why=pY(p),cap=pC(p);
    h+='<div class="photo-card"><div class="photo-side" onclick="window.open(''+esc(p.url)+'')"><img src="'+esc(e)+'" loading="lazy"><span class="pb" style="background:'+uc+'">'+esc(p.team||'')+'</span><span class="pn">#'+(i+1)+'</span></div><div class="info-side"><div class="fn">'+esc(desc)+'</div><div class="fr">';
    if(where)h+='<span class="fk">Location</span><span class="fv">'+esc(where)+'</span>';
    if(cap)h+='<span class="fk">Captured</span><span class="fv">'+esc(fmtD(cap))+'</span>';
    h+='<span class="fk">Unit</span><span class="fv" style="color:'+uc+';font-weight:600">'+esc(p.team||'')+'</span><span class="fk">By</span><span class="fv">'+esc(p.sender||'')+'</span></div>';
    if(why)h+='<div class="fp">"'+esc(why)+'"</div>';
    h+='</div></div>'
  });
  h+='</div></div></div>';return h
}

function IR(insp,df){
  var uiM={};
  insp.forEach(function(ins){
    var team=ins.team||'UNASSIGNED';if(!uiM[team])uiM[team]={inspector:ins.sender||'',time:ins.time||'',sections:{},remarks:[]};
    var pm={};
    try{var pd=JSON.parse(ins.photo||'[]');if(Array.isArray(pd))pd.forEach(function(p){pm[p.label]=(p.urls||[]).map(function(u){var m2=(u||'').match(/[?&]id=([a-zA-Z0-9_-]+)/);return{embed:m2?'https://lh3.googleusercontent.com/d/'+m2[1]:u,raw:u}})})}catch(e){}
    var ls=(ins.body||'').split('
');
    ls.forEach(function(l){
      if(l.indexOf('✓ ')!==-1){
        var cl=l.replace('✓ ','').trim();var lb=cl.replace(/ \(.*\)$/,'');var se='';var m3=cl.match(/\((.+)\)$/);if(m3)se=m3[1];if(!se)se='General';
        if(!uiM[team].sections[se])uiM[team].sections[se]=[];uiM[team].sections[se].push({label:lb,photos:pm[lb]||[]})
      }
      if(l.indexOf('Remarks: ')!==-1)uiM[team].remarks.push(l.substring(9).trim())
    })
  });
  var un2=Object.keys(uiM).sort();
  var h='<div class="card"><div class="card-hdr">DAILY INSPECTION REPORT'+(un2.length>1?'S':'')+' ('+insp.length+' Inspector'+(insp.length>1?'s':'')+')</div><div class="card-body">';
  un2.forEach(function(u){
    var ui=uiM[u];var sk=Object.keys(ui.sections).sort();var tui=0;sk.forEach(function(k){tui+=ui.sections[k].length});
    var uColor=CO[un2.indexOf(u)%7];
    h+='<div class="inspect-block" style="border-color:'+uColor+'"><div class="inspect-hdr"><div><span style="font-size:15px;font-weight:700;color:#fff">'+esc(u)+'</span><span style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);margin-left:10px">Inspected by: '+esc(ui.inspector)+'</span></div><span style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim)">'+esc((ui.time||'').substring(0,19))+'</span></div><div class="inspect-body">';
    sk.forEach(function(sec){
      h+='<div class="inspect-sec"><div class="inspect-sec-title">'+esc(sec)+'</div>';
      ui.sections[sec].forEach(function(item){
        h+='<div class="inspect-item"><span><span style="color:var(--success);font-weight:700">✓</span> '+esc(item.label)+'</span>';
        if(item.photos.length>0){h+='<div class="inspect-photos">';item.photos.forEach(function(ph){h+='<img src="'+esc(ph.embed)+'" onclick="window.open(''+esc(ph.raw)+'')" loading="lazy">'});h+='</div>'}
        h+='</div>'
      });
      h+='</div>'
    });
    if(ui.remarks.length>0){h+='<div class="inspect-remarks"><div style="font-family:var(--font-mono);font-size:9px;color:var(--warning);letter-spacing:1px;margin-bottom:4px">REMARKS</div>';ui.remarks.forEach(function(r){h+='<div style="font-size:12px;color:var(--text-secondary);font-style:italic">'+esc(r)+'</div>'});h+='</div>'}
    h+='<div style="margin-top:10px;font-size:12px;color:var(--text-dim)">'+esc(u)+' conducted inspection of '+tui+' items across '+sk.length+' categor'+(sk.length>1?'ies':'y')+'. All items satisfactory.'+(ui.remarks.length>0?' '+ui.remarks.length+' observation(s) noted.':'')+'</div>';
    h+='</div></div>'
  });
  // Consolidated
  var gT=0,tR=0,aC=[];un2.forEach(function(u){var ui2=uiM[u];Object.keys(ui2.sections).forEach(function(k){gT+=ui2.sections[k].length;if(aC.indexOf(k)<0)aC.push(k)});tR+=ui2.remarks.length});
