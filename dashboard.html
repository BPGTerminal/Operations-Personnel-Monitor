<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPM — Operations Dashboard</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00e5ff">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="opm-core.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<style>
body { min-height: 100vh; display: flex; flex-direction: column; overflow-y: auto; }

/* Header */
.dash-header {
  background: var(--bg-panel); border-bottom: 1px solid var(--border-color);
  padding: 10px 20px; display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0; gap: 12px;
}
.dash-header h1 { font-size: 18px; font-weight: 700; letter-spacing: 2px; color: #fff; }
.dash-header h1 span { color: var(--accent); }

/* Filters */
.filter-bar {
  background: var(--bg-panel); border-bottom: 1px solid var(--border-color);
  padding: 10px 20px; display: flex; align-items: center; gap: 10px;
  flex-shrink: 0; flex-wrap: wrap;
}
.filter-bar label { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); letter-spacing: 1px; white-space: nowrap; }
.filter-bar input[type="date"] {
  background: var(--bg-surface); border: 1px solid var(--border-color);
  color: #fff; font-family: var(--font-mono); font-size: 10px; padding: 5px 8px;
  border-radius: var(--radius);
}

/* Main content */
.dash-content {
  flex: 1; padding: 20px; display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 18px; max-width: 1400px; width: 100%; margin: 0 auto;
}

/* Stats cards row */
.stats-row {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
}
.stat-card {
  background: var(--bg-panel); border: 1px solid var(--border-color);
  border-radius: var(--radius); padding: 16px; text-align: center;
}
.stat-value {
  font-family: var(--font-mono); font-size: 32px; font-weight: 700;
  color: var(--accent); line-height: 1;
}
.stat-label {
  font-family: var(--font-mono); font-size: 9px; color: var(--text-dim);
  letter-spacing: 1px; margin-top: 6px; text-transform: uppercase;
}

/* Chart cards */
.chart-card {
  background: var(--bg-panel); border: 1px solid var(--border-color);
  border-radius: var(--radius); padding: 16px;
  display: flex; flex-direction: column;
}
.chart-card.half { grid-column: span 1; }
.chart-card.full { grid-column: 1 / -1; }

.chart-title {
  font-family: var(--font-mono); font-size: 10px; color: var(--accent);
  letter-spacing: 1.5px; margin-bottom: 10px; text-transform: uppercase; font-weight: 700;
}
.chart-wrap { flex: 1; position: relative; min-height: 250px; }
.chart-wrap canvas { width: 100% !important; }

/* Insight text */
.insight {
  margin-top: 10px; padding: 10px 12px;
  background: var(--accent-dim); border-left: 3px solid var(--accent);
  font-size: var(--font-sm); color: var(--text-secondary);
  border-radius: 0 var(--radius) var(--radius) 0; line-height: 1.5;
}
.insight.warn { border-color: var(--warning); background: var(--warning-dim); }
.insight.success { border-color: var(--success); background: var(--success-dim); }

/* Photo gallery */
.photo-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 8px;
  margin-top: 8px;
}
.photo-thumb {
  position: relative; aspect-ratio: 4/3; overflow: hidden;
  border-radius: var(--radius); border: 1px solid var(--border-color);
  cursor: pointer; background: var(--bg-surface);
}
.photo-thumb img {
  width: 100%; height: 100%; object-fit: cover;
  transition: transform var(--transition);
}
.photo-thumb:hover img { transform: scale(1.05); }
.photo-thumb .photo-meta {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: linear-gradient(transparent, rgba(0,0,0,.85));
  padding: 6px 8px; font-size: 8px;
  font-family: var(--font-mono); color: #fff;
}

/* Narrative section */
.narrative {
  background: var(--bg-panel); border: 1px solid var(--border-color);
  border-radius: var(--radius); padding: 16px;
  grid-column: 1 / -1;
}
.narrative h3 { font-family: var(--font-mono); font-size: 11px; color: var(--accent); letter-spacing: 2px; margin-bottom: 8px; }
.narrative p { font-size: var(--font-sm); color: var(--text-secondary); line-height: 1.7; margin-bottom: 8px; }

/* Messages log */
.msg-log {
  grid-column: 1 / -1;
  background: var(--bg-panel); border: 1px solid var(--border-color);
  border-radius: var(--radius); padding: 16px; max-height: 500px; overflow-y: auto;
}
.msg-log-row {
  display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.03);
  font-size: var(--font-xs);
}
.msg-log-time { font-family: var(--font-mono); color: var(--text-dim); min-width: 75px; flex-shrink: 0; }
.msg-log-sender { color: var(--accent); font-weight: 600; min-width: 100px; flex-shrink: 0; }
.msg-log-body { flex: 1; color: var(--text-secondary); }

/* PDF / Print */
@media print {
  body { background: #fff !important; color: #000 !important; overflow: visible !important; }
  .dash-header, .filter-bar, .btn { display: none !important; }
  .dash-content { grid-template-columns: 1fr 1fr !important; padding: 10px !important; }
  .stat-card, .chart-card, .narrative { background: #fff !important; border: 1px solid #ccc !important; break-inside: avoid; }
  .stat-value { color: #1a4d8f !important; }
  .chart-title { color: #1a4d8f !important; }
  * { color: #000 !important; text-shadow: none !important; }
}

/* Empty state */
.empty-state { text-align: center; padding: 40px; color: var(--text-dim); font-family: var(--font-mono); font-size: 12px; }

/* Modal for photo */
.photo-modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.92);
  z-index: 9999; align-items: center; justify-content: center; flex-direction: column;
}
.photo-modal-overlay.show { display: flex; }
.photo-modal-overlay img { max-width: 92vw; max-height: 85vh; border: 2px solid var(--accent); border-radius: 6px; }
.photo-modal-close { position: absolute; top: 20px; right: 28px; color: #fff; font-size: 32px; cursor: pointer; font-family: var(--font-mono); }
</style>
</head>
<body>

<!-- Header -->
<div class="dash-header">
  <div class="flex items-center gap-sm">
    <span class="badge badge-accent">OPM DASHBOARD</span>
    <h1 id="dash-title">Operations Summary <span>// Report</span></h1>
  </div>
  <div class="flex gap-sm">
    <button class="btn btn-sm" onclick="window.print()">🖨 PRINT / PDF</button>
    <button class="btn btn-primary btn-sm" onclick="refreshDashboard()">🔄 REFRESH</button>
    <a class="btn btn-sm" href="commander.html">▶ COMMANDER</a>
    <a class="btn btn-sm" href="admin.html">⚙ ADMIN</a>
  </div>
</div>

<!-- Filters -->
<div class="filter-bar">
  <label>DATE FROM:</label>
  <input type="date" id="f-date-from" onchange="refreshDashboard()">
  <label>TO:</label>
  <input type="date" id="f-date-to" onchange="refreshDashboard()">
  <button class="btn btn-sm" onclick="document.getElementById('f-date-from').value='';document.getElementById('f-date-to').value='';refreshDashboard();">ALL TIME</button>
  <button class="btn btn-sm btn-success" onclick="setToday();">TODAY</button>
  <button class="btn btn-sm btn-warning" onclick="setThisWeek();">THIS WEEK</button>
  <span style="flex:1;"></span>
  <span id="last-updated" class="mono text-dim" style="font-size:9px;"></span>
</div>

<!-- Content -->
<div class="dash-content" id="dash-content">
  <div class="chart-card full">
    <div class="empty-state">⏳ Loading dashboard data...</div>
  </div>
</div>

<!-- Photo Modal -->
<div class="photo-modal-overlay" id="photo-modal">
  <span class="photo-modal-close" onclick="document.getElementById('photo-modal').classList.remove('show')">✕</span>
  <img id="photo-modal-img" src="" alt="Photo">
</div>

<script src="opm-core.js"></script>
<script>
// ============================================================
// DASHBOARD STATE
// ============================================================
let chartInstances = {};

function destroyCharts() {
  Object.values(chartInstances).forEach(c => c.destroy());
  chartInstances = {};
}

// ═══════════ DATA FETCH ═══════════
async function fetchDashboardData() {
  const url = OPM.SHEET_URL();
  if (!url) return null;

  const from = document.getElementById('f-date-from').value;
  const to   = document.getElementById('f-date-to').value;

  try {
    const params = new URLSearchParams({ action: 'getDashboardData', t: Date.now() });
    if (from) params.set('dateFrom', from + ' 00:00:00');
    if (to)   params.set('dateTo',   to   + ' 23:59:59');
    const res = await fetch(url + '?' + params, { cache: 'no-store' });
    return await res.json();
  } catch(e) {
    console.error('[OPM] Dashboard fetch:', e.message);
    return null;
  }
}

// ═══════════ FILTER HELPERS ═══════════
function setToday() {
  const d = new Date().toISOString().substring(0,10);
  document.getElementById('f-date-from').value = d;
  document.getElementById('f-date-to').value = d;
  refreshDashboard();
}
function setThisWeek() {
  const now = new Date();
  const day = now.getDay();
  const monday = new Date(now); monday.setDate(now.getDate() - (day === 0 ? 6 : day-1));
  const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
  document.getElementById('f-date-from').value = monday.toISOString().substring(0,10);
  document.getElementById('f-date-to').value   = sunday.toISOString().substring(0,10);
  refreshDashboard();
}

// ═══════════ MAIN RENDER ═══════════
async function refreshDashboard() {
  destroyCharts();
  document.getElementById('dash-content').innerHTML = '<div class="chart-card full"><div class="empty-state">⏳ Loading dashboard data...</div></div>';

  const data = await fetchDashboardData();
  document.getElementById('last-updated').textContent = 'Updated: ' + OPM.formatTime();

  if (!data || !data.summary || data.summary.totalMessages === 0) {
    document.getElementById('dash-content').innerHTML = `
      <div class="chart-card full">
        <div class="empty-state">
          📊 No data available for this period.<br><br>
          <button class="btn btn-primary btn-sm" onclick="refreshDashboard()">🔄 TRY AGAIN</button>
        </div>
      </div>`;
    return;
  }

  const s = data.summary;
  const cfg = OPM.getConfig();
  document.getElementById('dash-title').innerHTML = `${cfg.eventName || 'Operations Summary'} <span>// ${cfg.commander || 'Report'}</span>`;

  buildDashboard(data);
}

// ═══════════ BUILD DASHBOARD ═══════════
function buildDashboard(data) {
  const s = data.summary;
  // Unit data
  const unitData = Array.isArray(data.unitData) ? data.unitData : [];
  const categories = data.categories || {};
  const daily     = data.dailyActivity || [];
  const photos    = data.photos || [];
  const all       = data.allMessages || [];
  const perTeam   = data.personnelByTeam || {};

  const unitNames = unitData.map(u => u.team);
  const unitTasks = unitData.map(u => u.tasks || 0);
  const unitMsgs  = unitData.map(u => u.messages || 0);
  const unitIncs  = unitData.map(u => u.incidents || 0);

  const catLabels = Object.keys(categories);
  const catValues = Object.values(categories);

  const dailyLabels = daily.map(d => d.date);
  const dailyMsgs   = daily.map(d => d.messages);
  const dailyPhotos = daily.map(d => d.photos);

  // Compute insights
  const totalTasks  = unitData.reduce((a,u) => a + (u.tasks||0), 0);
  const totalIncs   = unitData.reduce((a,u) => a + (u.incidents||0), 0);
  const topUnit     = unitData.sort((a,b) => (b.tasks||0)-(a.tasks||0))[0];
  const incidentUnits = unitData.filter(u => (u.incidents||0) > 0);

  let html = '';

  // ── STATS CARDS ──────────────────────────
  html += `<div class="stats-row">
    <div class="stat-card"><div class="stat-value">${s.totalMessages}</div><div class="stat-label">Total Messages</div></div>
    <div class="stat-card"><div class="stat-value">${s.totalPhotos}</div><div class="stat-label">Photo Reports</div></div>
    <div class="stat-card"><div class="stat-value" style="color:var(--success);">${totalTasks}</div><div class="stat-label">Tasks Accomplished</div></div>
    <div class="stat-card"><div class="stat-value" style="color:var(--warning);">${totalIncs}</div><div class="stat-label">Incidents Logged</div></div>
    <div class="stat-card"><div class="stat-value">${s.totalPersonnel}</div><div class="stat-label">Personnel Deployed</div></div>
    <div class="stat-card"><div class="stat-value" style="color:var(--success);">${s.onlineNow}</div><div class="stat-label">Currently Online</div></div>
  </div>`;

  // ── CHART: Tasks per Unit ────────────────
  if (unitNames.length > 0) {
    html += `<div class="chart-card half">
      <div class="chart-title">📊 Tasks Accomplished per Unit</div>
      <div class="chart-wrap"><canvas id="chart-tasks"></canvas></div>
      <div class="insight${topUnit && topUnit.tasks > 0 ? ' success' : ''}">
        <strong>Insight:</strong> ${topUnit && topUnit.tasks > 0
          ? `<strong>${topUnit.team}</strong> led operations with <strong>${topUnit.tasks} tasks accomplished</strong>, representing the highest output among all units.`
          : 'No tasks recorded in this period. Personnel should log accomplishments via the app.'}
      </div>
    </div>`;

    // ── CHART: Incidents per Unit ──────────
    html += `<div class="chart-card half">
      <div class="chart-title">⚠ Incidents & Reports per Unit</div>
      <div class="chart-wrap"><canvas id="chart-incidents"></canvas></div>
      <div class="insight${totalIncs > 0 ? ' warn' : ''}">
        <strong>Insight:</strong> ${totalIncs > 0
          ? incidentUnits.map(u => `<strong>${u.team}</strong>: ${u.incidents} incident${u.incidents>1?'s':''}`).join('; ') + `. Total of <strong>${totalIncs}</strong> incidents requiring attention.`
          : 'No incidents reported — all units operating smoothly.'}
      </div>
    </div>`;

    // ── CHART: Activity Over Time ──────────
    if (dailyLabels.length > 1) {
      html += `<div class="chart-card full">
        <div class="chart-title">📈 Daily Activity Trend</div>
        <div class="chart-wrap"><canvas id="chart-daily"></canvas></div>
        <div class="insight">
          <strong>Insight:</strong> Activity ${dailyMsgs.length > 2
            ? `peaked at <strong>${Math.max(...dailyMsgs)} messages</strong> on <strong>${dailyLabels[dailyMsgs.indexOf(Math.max(...dailyMsgs))]}</strong>. Average of <strong>${(dailyMsgs.reduce((a,b)=>a+b,0)/dailyMsgs.length).toFixed(1)}</strong> messages per day.`
            : 'More data needed for trend analysis.'}
        </div>
      </div>`;
    }
  }

  // ── CHART: Message Categories (Pie) ─────
  if (catLabels.length > 0) {
    html += `<div class="chart-card half">
      <div class="chart-title">🍩 Communications Breakdown</div>
      <div class="chart-wrap"><canvas id="chart-cats"></canvas></div>
      <div class="insight">
        <strong>Insight:</strong> ${catLabels[0]} comprises <strong>${catValues[0]}</strong> messages (${((catValues[0]/s.totalMessages)*100).toFixed(0)}% of all communications).
        ${catLabels.length > 1 ? `<strong>${catLabels[1]}</strong> follows with ${catValues[1]} entries.` : ''}
      </div>
    </div>`;

    // ── CHART: Personnel Distribution ─────
    html += `<div class="chart-card half">
      <div class="chart-title">👥 Personnel by Unit</div>
      <div class="chart-wrap"><canvas id="chart-personnel"></canvas></div>
      <div class="insight success">
        <strong>Insight:</strong> <strong>${s.totalPersonnel} personnel</strong> deployed across <strong>${Object.keys(perTeam).length} units</strong>. ${s.onlineNow} currently active in the field.
      </div>
    </div>`;
  }

  // ── PHOTO GALLERY ───────────────────────
  if (photos.length > 0) {
    html += `<div class="chart-card full">
      <div class="chart-title">📸 Operations Photos (${photos.length})</div>
      <div class="photo-grid">`;
    photos.slice(0, 12).forEach(p => {
      const match = (p.url||'').match(/[?&]id=([a-zA-Z0-9_-]+)/);
      const embed = match ? 'https://lh3.googleusercontent.com/d/'+match[1] : p.url;
      html += `<div class="photo-thumb" onclick="openPhoto('${embed}','${p.url}')" title="${p.sender} · ${p.team}">
        <img src="${embed}" loading="lazy" onerror="this.parentElement.style.display='none'">
        <div class="photo-meta">${p.sender} · ${p.time||''}</div>
      </div>`;
    });
    html += `</div>
      <div class="insight">
        <strong>Insight:</strong> <strong>${photos.length} photo reports</strong> submitted. Photos provide visual documentation of field conditions, incidents, and task completion.
        ${photos.length > 6 ? 'Showing latest 12 of ' + photos.length + ' photos.' : ''}
      </div>
    </div>`;
  }

  // ── NARRATIVE SUMMARY ───────────────────
  html += `<div class="narrative">
    <h3>📝 OPERATIONS NARRATIVE</h3>
    <p>
      <strong>Period:</strong> ${document.getElementById('f-date-from').value || 'All time'} to ${document.getElementById('f-date-to').value || 'present'}<br>
      <strong>Total Personnel Deployed:</strong> ${s.totalPersonnel} across ${Object.keys(perTeam).length} units<br>
      <strong>Total Messages Exchanged:</strong> ${s.totalMessages}<br>
      <strong>Photo Reports Submitted:</strong> ${s.totalPhotos}<br>
      <strong>Tasks Accomplished:</strong> ${totalTasks}<br>
      <strong>Incidents Logged:</strong> ${totalIncs}<br>
      <strong>Approvals Granted:</strong> ${s.approvalsApproved} | <strong>Rejected:</strong> ${s.approvalsRejected}
    </p>
    <p>
      During this reporting period, the Operations Personnel Monitor tracked <strong>${s.totalMessages} communications</strong> across the terminal operations.
      ${topUnit && topUnit.tasks > 0
        ? `<strong>${topUnit.team}</strong> was the most active unit with <strong>${topUnit.tasks} tasks accomplished</strong>. `
        : 'Units are encouraged to log task completions via the personnel app for better tracking. '}
      ${totalIncs > 0
        ? `<strong>${totalIncs} incidents</strong> were logged, requiring command attention and follow-up. `
        : 'No incidents were reported during this period. '}
      ${s.totalPhotos > 0
        ? `<strong>${s.totalPhotos} photo reports</strong> were submitted from the field, providing visual documentation of operations. `
        : ''}
      The system maintained <strong>${s.onlineNow} active personnel</strong> monitoring at the time of this report.
    </p>
  </div>`;

  // ── FULL MESSAGE LOG ────────────────────
  if (all.length > 0) {
    html += `<div class="msg-log">
      <div class="chart-title" style="margin-bottom:12px;">📋 Complete Message Log (${all.length})</div>
      ${all.slice().reverse().slice(0, 100).map(m => `
        <div class="msg-log-row">
          <span class="msg-log-time">${(m.time||'').substring(0,19)}</span>
          <span class="msg-log-sender">${m.sender||''}${m.team?' ['+m.team+']':''}</span>
          <span class="msg-log-body">${(m.body||'').substring(0,120)}${m.photo?' 📷':''}</span>
        </div>`).join('')}
      ${all.length > 100 ? '<div style="text-align:center;padding:8px;color:var(--text-dim);">Showing latest 100 of ' + all.length + ' messages</div>' : ''}
    </div>`;
  }

  document.getElementById('dash-content').innerHTML = html;

  // ── Render Charts ────────────────────────
  setTimeout(() => renderCharts(unitNames, unitTasks, unitMsgs, unitIncs, dailyLabels, dailyMsgs, dailyPhotos, catLabels, catValues, perTeam), 200);
}

// ═══════════ CHARTS ═══════════
function renderCharts(unitNames, unitTasks, unitMsgs, unitIncs, dailyLabels, dailyMsgs, dailyPhotos, catLabels, catValues, perTeam) {
  const chartColors = ['#00e5ff','#00ff88','#ff6b35','#ffd166','#a29bfe','#fd79a8','#55efc4'];

  // Tasks per Unit (Bar)
  const el1 = document.getElementById('chart-tasks');
  if (el1) {
    chartInstances.tasks = new Chart(el1, {
      type: 'bar',
      data: {
        labels: unitNames,
        datasets: [
          { label: 'Tasks', data: unitTasks, backgroundColor: chartColors.slice(0,unitNames.length), borderWidth: 0, borderRadius: 4 },
          { label: 'Messages', data: unitMsgs, backgroundColor: chartColors.slice(0,unitNames.length).map(c=>c+'44'), borderWidth: 0, borderRadius: 4 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { labels: { color: '#6a80b0', font: { family: 'Share Tech Mono', size: 10 } } } },
        scales: {
          x: { ticks: { color: '#6a80b0', font: { size: 9 }, maxRotation: 45 }, grid: { color: '#1e326020' } },
          y: { ticks: { color: '#6a80b0', font: { size: 9 } }, grid: { color: '#1e326030' }, beginAtZero: true }
        }
      }
    });
  }

  // Incidents per Unit (Bar)
  const el2 = document.getElementById('chart-incidents');
  if (el2) {
    chartInstances.incidents = new Chart(el2, {
      type: 'bar',
      data: {
        labels: unitNames,
        datasets: [{ label: 'Incidents', data: unitIncs, backgroundColor: ['#ffaa00','#ff7744','#ff4465','#ffaa00','#ff7744','#ff4465','#ffaa00'], borderWidth: 0, borderRadius: 4 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { labels: { color: '#6a80b0', font: { family: 'Share Tech Mono', size: 10 } } } },
        scales: {
          x: { ticks: { color: '#6a80b0', font: { size: 9 }, maxRotation: 45 }, grid: { color: '#1e326020' } },
          y: { ticks: { color: '#6a80b0', font: { size: 9 } }, grid: { color: '#1e326030' }, beginAtZero: true }
        }
      }
    });
  }

  // Daily Activity (Line)
  const el3 = document.getElementById('chart-daily');
  if (el3) {
    chartInstances.daily = new Chart(el3, {
      type: 'line',
      data: {
        labels: dailyLabels,
        datasets: [
          { label: 'Messages', data: dailyMsgs, borderColor: '#00e5ff', backgroundColor: '#00e5ff20', tension: .3, fill: true, pointRadius: 4 },
          { label: 'Photos', data: dailyPhotos, borderColor: '#00ff88', backgroundColor: '#00ff8820', tension: .3, fill: true, pointRadius: 4 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { labels: { color: '#6a80b0', font: { family: 'Share Tech Mono', size: 10 } } } },
        scales: {
          x: { ticks: { color: '#6a80b0', font: { size: 8 }, maxRotation: 45 }, grid: { color: '#1e326020' } },
          y: { ticks: { color: '#6a80b0', font: { size: 9 } }, grid: { color: '#1e326030' }, beginAtZero: true }
        }
      }
    });
  }

  // Categories (Pie)
  const el4 = document.getElementById('chart-cats');
  if (el4) {
    chartInstances.cats = new Chart(el4, {
      type: 'doughnut',
      data: {
        labels: catLabels,
        datasets: [{ data: catValues, backgroundColor: chartColors.slice(0,catLabels.length), borderWidth: 2, borderColor: '#0c1526' }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom', labels: { color: '#6a80b0', font: { family: 'Share Tech Mono', size: 9 }, padding: 12 } } }
      }
    });
  }

  // Personnel per Team (Pie)
  const el5 = document.getElementById('chart-personnel');
  if (el5) {
    const pLabels = Object.keys(perTeam);
    const pValues = Object.values(perTeam);
    chartInstances.personnel = new Chart(el5, {
      type: 'doughnut',
      data: {
        labels: pLabels,
        datasets: [{ data: pValues, backgroundColor: chartColors.slice(0,pLabels.length), borderWidth: 2, borderColor: '#0c1526' }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom', labels: { color: '#6a80b0', font: { family: 'Share Tech Mono', size: 9 }, padding: 12 } } }
      }
    });
  }
}

// ═══════════ PHOTO MODAL ═══════════
function openPhoto(embed, fallback) {
  const modal = document.getElementById('photo-modal');
  const img   = document.getElementById('photo-modal-img');
  img.src = embed;
  img.onerror = () => { img.src = fallback; };
  modal.classList.add('show');
}
document.getElementById('photo-modal').addEventListener('click', function(e) {
  if (e.target === this) this.classList.remove('show');
});
document.addEventListener('keydown', e => { if (e.key==='Escape') document.getElementById('photo-modal').classList.remove('show'); });

// ═══════════ INIT ═══════════
document.addEventListener('DOMContentLoaded', () => {
  // Set today as default
  setToday();
});
</script>
