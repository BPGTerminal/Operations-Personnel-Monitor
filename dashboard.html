<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPM — Terminal Operations & Management Report</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#00e5ff">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="opm-core.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
body{min-height:100vh;display:flex;flex-direction:column;overflow-y:auto;background:var(--bg-base)}
.header{text-align:center;padding:20px 20px 8px;background:var(--bg-panel);border-bottom:2px solid var(--accent)}
.header img{max-width:200px;max-height:80px}
.header h1{font-size:20px;font-weight:700;letter-spacing:3px;color:#fff;text-transform:uppercase;margin-top:8px}
.header .sub{font-family:var(--font-mono);font-size:9px;color:var(--accent);letter-spacing:2px}
.bar{background:var(--bg-panel);border-bottom:1px solid var(--border-color);padding:8px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:100}
.bar label{font-family:var(--font-mono);font-size:9px;color:var(--text-dim);letter-spacing:1px;white-space:nowrap}
.bar select,.bar input{background:var(--bg-surface);border:1px solid var(--border-color);color:#fff;font-family:var(--font-mono);font-size:10px;padding:5px 8px;border-radius:var(--radius);outline:none}
.bar select option{background:var(--bg-panel);color:var(--text-secondary)}
.content{max-width:1100px;width:100%;margin:0 auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--bg-panel);border:1px solid var(--border-color);border-radius:6px;overflow:hidden}
.card-hdr{background:var(--accent-dim);padding:11px 18px;font-family:var(--font-mono);font-size:9px;color:var(--accent);letter-spacing:2px;font-weight:700;border-bottom:1px solid var(--border-color);text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.card-body{padding:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--border-color);border-radius:6px;overflow:hidden}
.stats div{background:var(--bg-panel);padding:16px;text-align:center}
.stats .n{font-family:var(--font-mono);font-size:28px;font-weight:700;color:var(--accent)}
.stats .l{font-family:var(--font-mono);font-size:8px;color:var(--text-dim);letter-spacing:1px;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:var(--font-xs)}
th{background:rgba(0,0,0,.25);color:var(--accent);font-family:var(--font-mono);font-size:9px;letter-spacing:1px;padding:10px 14px;text-align:left;border-bottom:1px solid var(--border-color)}
td{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.04);color:var(--text-secondary)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.num{font-family:var(--font-mono);font-weight:700;text-align:center}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.photo-card{display:grid;grid-template-columns:1fr 1fr;background:var(--bg-surface);border:1px solid var(--border-color);border-radius:8px;overflow:hidden}
.photo-side{position:relative;min-height:260px;overflow:hidden;cursor:pointer;background:rgba(0,0,0,.3)}
.photo-side img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;transition:transform .3s}
.photo-side:hover img{transform:scale(1.03)}
.photo-side .pb{position:absolute;top:10px;left:10px;padding:3px 10px;border-radius:3px;font-family:var(--font-mono);font-size:8px;color:#000;z-index:2}
.photo-side .pn{position:absolute;top:10px;right:10px;background:var(--accent);color:#000;font-family:var(--font-mono);font-size:8px;font-weight:700;padding:3px 10px;border-radius:3px;z-index:2}
.info-side{padding:16px 20px;display:flex;flex-direction:column;gap:8px}
.info-side .fn{font-size:20px;font-weight:700;color:#fff;line-height:1.3}
.info-side .fr{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:var(--font-xs)}
.info-side .fk{font-family:var(--font-mono);color:var(--accent);font-size:9px;white-space:nowrap}
.info-side .fv{color:var(--text-dim)}
.info-side .fp{font-size:13px;color:var(--text-secondary);line-height:1.5;font-style:italic;padding-top:8px;border-top:1px solid rgba(255,255,255,.08)}
.inspect-block{border:2px solid var(--border-color);border-radius:8px;margin-bottom:14px;overflow:hidden}
.inspect-hdr{background:rgba(0,0,0,.3);padding:10px 16px;display:flex;justify-content:space-between;align-items:center}
.inspect-body{padding:14px 16px}
.inspect-sec{margin-bottom:10px}
.inspect-sec-title{font-family:var(--font-mono);font-size:9px;color:var(--accent);letter-spacing:1px;margin-bottom:6px;text-transform:uppercase}
.inspect-item{padding:7px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.inspect-item span{font-size:13px;color:var(--text-secondary)}
.inspect-photos{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;margin-left:22px}
.inspect-photos img{width:110px;height:82px;object-fit:cover;border-radius:4px;border:1px solid var(--border-color);cursor:pointer}
.inspect-remarks{margin-top:8px;padding:10px 12px;background:rgba(255,170,0,.06);border-left:3px solid var(--warning);border-radius:0 4px 4px 0}
.narrative-box{width:100%;min-height:160px;background:rgba(0,0,0,.3);border:1px solid var(--border-color);color:var(--text-primary);font-family:var(--font-sans);font-size:var(--font-sm);padding:14px;line-height:1.8;resize:vertical;border-radius:var(--radius);outline:none}
.narrative-box:focus{border-color:var(--accent)}
.msg-log{max-height:400px;overflow-y:auto;font-size:var(--font-xs)}
.mr{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.mt{font-family:var(--font-mono);color:var(--text-dim);min-width:80px;font-size:9px}
.ms{color:var(--accent);font-weight:600;min-width:110px}
.mb{flex:1;color:var(--text-secondary)}
.empty{text-align:center;padding:40px;color:var(--text-dim);font-family:var(--font-mono);font-size:12px}
.footer{text-align:center;padding:16px 0 24px;font-family:var(--font-mono);opacity:.7}
.footer .ft{font-size:9px;color:var(--accent);letter-spacing:2px}
.footer .fs{font-size:8px;color:var(--text-dim);margin-top:4px}
@media(max-width:768px){.photo-card{grid-template-columns:1fr!important}}
@media print{
  @page { margin: 0.6cm; size: A4; }
  /* ── Kill dark mode at the root ── */
  :root, html { color-scheme: light !important; background: #fff !important; }
  /* ── Nuclear white reset: every possible element ── */
  :root, html, body, *, *::before, *::after,
  div, section, article, header, footer, aside, nav, main,
  p, span, a, h1, h2, h3, h4, h5, h6, strong, b, i, em, u, small,
  table, tr, td, th, thead, tbody, ul, ol, li, dl, dt, dd,
  img, canvas, svg, path, rect, circle, line, text,
  textarea, input, select, label, button, pre, code, blockquote,
  .card, .card-hdr, .card-body, .panel, .panel-header, .panel-body {
    background: #fff !important;
    background-color: #fff !important;
    background-image: none !important;
    color: #000 !important;
    border-color: #ccc !important;
    text-shadow: none !important;
    box-shadow: none !important;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
  /* ── Hide interactive elements ── */
  .bar, .btn, .footer, button, a.btn, .inspect-add-photo,
  .pb, .pn, .photo-side .pb, .photo-side .pn,
  #toast-container, .modal-overlay { display: none !important; }
  /* ── Header ── */
  .header { border-bottom: 2px solid #1a4d8f !important; padding: 8px 0 4px !important; }
  .header img { max-width: 100px !important; max-height: 40px !important; }
  .header h1 { font-size: 14px !important; margin-top: 2px !important; color: #1a4d8f !important; letter-spacing: 1px !important; }
  .header .sub { color: #555 !important; font-size: 8px !important; }
  /* ── Content area ── */
  .content { padding: 2px 0 !important; max-width: none !important; gap: 4px !important; }
  /* ── Cards ── */
  .card { border: 1px solid #ddd !important; border-radius: 0 !important; margin-bottom: 3px !important; page-break-inside: avoid; }
  .card-hdr { background: #e8ecf0 !important; color: #1a4d8f !important; padding: 3px 8px !important; font-size: 8px !important; letter-spacing: 1px !important; border-bottom: 1px solid #ccc !important; }
  .card-body { padding: 4px 8px !important; }
  /* ── Stats grid ── */
  .stats { grid-template-columns: repeat(6,1fr) !important; gap: 1px !important; background: #ccc !important; border-radius: 0 !important; }
  .stats div { padding: 4px !important; background: #fff !important; }
  .stats .n { color: #1a4d8f !important; font-size: 16px !important; }
  .stats .l { color: #555 !important; font-size: 6px !important; }
  /* ── Table ── */
  table { font-size: 8px !important; border-collapse: collapse !important; }
  th { background: #e8ecf0 !important; color: #1a4d8f !important; padding: 3px 5px !important; font-size: 7px !important; border-bottom: 1px solid #999 !important; }
  td { padding: 2px 5px !important; border-bottom: 1px solid #eee !important; font-size: 8px !important; }
  .dot { width: 8px !important; height: 8px !important; margin-right: 4px !important; }
  /* ── Photo grid: 3 columns dense ── */
  .photo-grid { grid-template-columns: repeat(3,1fr) !important; gap: 3px !important; }
  .photo-card { grid-template-columns: 1fr !important; border: 1px solid #ddd !important; border-radius: 0 !important; page-break-inside: avoid; }
  .photo-side { min-height: 100px !important; max-height: 100px !important; background: #f0f0f0 !important; }
  .photo-side img { height: 100px !important; object-fit: cover !important; }
  .info-side { padding: 3px 6px !important; gap: 0 !important; }
  .info-side .fn { font-size: 10px !important; color: #1a4d8f !important; line-height: 1.2 !important; }
  .info-side .fr { font-size: 7px !important; gap: 0 3px !important; }
  .info-side .fk { font-size: 6px !important; color: #1a4d8f !important; }
  .info-side .fv { color: #333 !important; }
  .info-side .fp { font-size: 8px !important; color: #333 !important; padding-top: 2px !important; border-top: 1px solid #eee !important; line-height: 1.2 !important; }
  /* ── Inspections ── */
  .inspect-block { border: 1px solid #ddd !important; border-radius: 0 !important; margin-bottom: 3px !important; page-break-inside: avoid; }
  .inspect-hdr { padding: 3px 6px !important; background: #e8ecf0 !important; }
  .inspect-hdr span { color: #000 !important; }
  .inspect-body { padding: 3px 6px !important; }
  .inspect-photos img { width: 50px !important; height: 38px !important; border: 1px solid #ddd !important; }
  .inspect-item { padding: 1px 0 !important; }
  .inspect-item span { font-size: 9px !important; }
  .inspect-remarks { background: #fff !important; border-left: 2px solid #999 !important; padding: 3px 6px !important; margin-top: 3px !important; }
  .inspect-remarks div { color: #333 !important; }
  .inspect-sec { margin-bottom: 3px !important; }
  .inspect-sec-title { color: #1a4d8f !important; font-size: 7px !important; margin-bottom: 2px !important; }
  .inspect-photos { margin-top: 2px !important; margin-left: 14px !important; gap: 3px !important; }
  /* ── Narrative ── */
  .narrative-box { min-height: 40px !important; font-size: 9px !important; padding: 3px 5px !important; border: 1px solid #ccc !important; background: #fff !important; line-height: 1.4 !important; }
  /* ── Comms log ── */
  .msg-log { max-height: none !important; font-size: 7px !important; }
  .mr { padding: 1px 0 !important; gap: 4px !important; }
  .mt, .ms, .mb { font-size: 7px !important; color: #333 !important; }
  .mt { min-width: 60px !important; }
  .ms { min-width: 80px !important; font-weight: 700 !important; color: #1a4d8f !important; }
  /* ── Unit section headers in photo report ── */
  .content h3 { color: #1a4d8f !important; font-size: 9px !important; margin-bottom: 3px !important; }
  /* ── Chart canvas ── */
  canvas { background: #fff !important; max-height: 140px !important; }
  /* ── Print-only footer on last page ── */
  .print-footer { display: flex !important; align-items: center; justify-content: center; gap: 6px; padding: 8px 0 0; margin-top: 8px; border-top: 1px solid #ccc; font-family: 'Share Tech Mono', monospace; }
  .print-footer img { width: 14px !important; height: 14px !important; border-radius: 50%; }
  .print-footer .pf-t { font-size: 8px; color: #1a4d8f; letter-spacing: 1px; font-weight: 700; }
  .print-footer .pf-s { font-size: 7px; color: #666; }
  /* ── Consolidated findings ── */
  .content h3 + p, .card-body > div > h3 { color: #1a4d8f !important; font-size: 9px !important; }
  .card-body > div[style] p { color: #333 !important; font-size: 8px !important; }
}</style>
</head>
<body>
<div class="header"><img src="bpgt-logo.png" alt="BPGT"><h1 id="cover-title">TERMINAL OPERATIONS AND MANAGEMENT REPORT</h1><div class="sub" id="cover-sub">BROOKE'S POINT GRAND TERMINAL</div></div>
<div class="bar">
<label>UNIT:</label><select id="unit" onchange="R()"><option value="">ALL UNITS</option></select>
<span style="color:var(--text-dim);margin:0 6px">|</span>
<label>FROM:</label><input type="date" id="from" onchange="R()">
<label>TO:</label><input type="date" id="to" onchange="R()">
<button class="btn btn-sm" onclick="document.getElementById('from').value='';document.getElementById('to').value='';R()">ALL</button>
<button class="btn btn-sm btn-success" onclick="T()">TODAY</button>
<button class="btn btn-sm btn-warning" onclick="W()">WEEK</button>
<span style="flex:1"></span>
<button class="btn btn-sm" onclick="window.print()">PRINT</button>
<button class="btn btn-primary btn-sm" onclick="R()">REFRESH</button>
<a class="btn btn-sm" href="commander.html">COMMANDER</a>
<a class="btn btn-sm" href="admin.html">ADMIN</a>
</div>
<div class="content" id="content"><div class="card"><div class="card-body empty">Loading report...</div></div></div>
<div class="print-footer" style="display:none"><img src="icon-192.png" style="width:14px;height:14px;border-radius:50%"><span class="pf-t">-=pagong=-</span><span class="pf-s">JOEY SABENACIO HEREDERO &middot; OPM &middot; &copy; 2026</span></div>
<div class="footer">
<div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:4px">
<img src="icon-192.png" style="width:18px;height:18px;border-radius:50%;opacity:.7">
<span class="ft">-=pagong=-</span>
</div>
<div class="fs">JOEY SABENACIO HEREDERO &middot; OPM &middot; &copy; 2026</div>
</div>
