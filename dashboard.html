<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPM — Operations Report</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00e5ff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="opm-core.css">
<style>
body{min-height:100vh;display:flex;flex-direction:column;overflow-y:auto;background:var(--bg-base);}

/* Report layout */
.report{max-width:1100px;width:100%;margin:0 auto;padding:0;flex:1;}

/* Cover / header section */
.report-cover{background:var(--bg-panel);border-bottom:3px solid var(--accent);padding:28px 32px;text-align:center;}
.report-cover .logo-row{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:8px;}
.report-cover .logo{width:48px;height:48px;border-radius:50%;}
.report-cover h1{font-size:22px;font-weight:700;letter-spacing:3px;color:#fff;text-transform:uppercase;margin-bottom:4px;}
.report-cover .subtitle{font-family:var(--font-mono);font-size:10px;color:var(--accent);letter-spacing:2px;}
.report-cover .meta-row{display:flex;justify-content:center;gap:32px;margin-top:12px;font-family:var(--font-mono);font-size:9px;color:var(--text-dim);flex-wrap:wrap;}
.report-cover .meta-row span strong{color:var(--text-secondary);}

/* Toolbar */
.report-toolbar{background:var(--bg-panel);border-bottom:1px solid var(--border-color);padding:8px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:100;}
.report-toolbar label{font-family:var(--font-mono);font-size:9px;color:var(--text-dim);letter-spacing:1px;white-space:nowrap;}
.report-toolbar input[type="date"]{background:var(--bg-surface);border:1px solid var(--border-color);color:#fff;font-family:var(--font-mono);font-size:10px;padding:5px 8px;border-radius:var(--radius);}
.report-body{padding:20px 24px;display:flex;flex-direction:column;gap:22px;}

/* Section */
.sec{border:1px solid var(--border-color);border-radius:6px;overflow:hidden;background:var(--bg-panel);}
.sec-hdr{background:var(--accent-dim);border-bottom:1px solid var(--border-color);padding:12px 20px;font-family:var(--font-mono);font-size:10px;letter-spacing:2px;color:var(--accent);text-transform:uppercase;font-weight:700;display:flex;justify-content:space-between;align-items:center;}
.sec-body{padding:20px;}

/* Stats bar */
.stats-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--border-color);border-radius:6px;overflow:hidden;}
.stat-item{background:var(--bg-panel);padding:16px 20px;text-align:center;}
.stat-num{font-family:var(--font-mono);font-size:28px;font-weight:700;color:var(--accent);line-height:1;}
.stat-lbl{font-family:var(--font-mono);font-size:8px;color:var(--text-dim);letter-spacing:1px;text-transform:uppercase;margin-top:4px;}

/* Unit tables */
.unit-table{width:100%;border-collapse:collapse;font-size:var(--font-xs);}
.unit-table th{background:rgba(0,0,0,.25);color:var(--accent);font-family:var(--font-mono);font-size:9px;letter-spacing:1px;padding:10px 14px;text-align:left;text-transform:uppercase;border-bottom:1px solid var(--border-color);}
.unit-table td{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.04);color:var(--text-secondary);}
.unit-table tr:hover td{background:var(--accent-dim);}
.unit-table .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;}
.unit-table .num{font-family:var(--font-mono);font-weight:700;text-align:center;}

/* Photo report cards */
.photo-report-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;}
.photo-report-card{background:var(--bg-surface);border:1px solid var(--border-color);border-radius:6px;overflow:hidden;}
.photo-report-card img{width:100%;height:200px;object-fit:cover;display:block;}
.photo-report-card .card-info{padding:12px 14px;}
.photo-report-card .card-desc{font-size:14px;font-weight:700;color:#fff;line-height:1.4;margin-bottom:8px;}
.photo-report-card .card-meta{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:var(--font-xs);}
.photo-report-card .card-meta .lbl{font-family:var(--font-mono);color:var(--accent);font-size:9px;white-space:nowrap;}
.photo-report-card .card-meta .val{color:var(--text-dim);word-break:break-word;}

/* Narrative */
.narrative-edit{width:100%;min-height:140px;background:rgba(0,0,0,.3);border:1px solid var(--border-color);color:var(--text-primary);font-family:var(--font-sans);font-size:var(--font-sm);padding:14px;line-height:1.8;resize:vertical;border-radius:var(--radius);outline:none;}
.narrative-edit:focus{border-color:var(--accent);}

/* Message log */
.msg-log{max-height:400px;overflow-y:auto;font-size:var(--font-xs);}
.msg-log-row{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.03);}
.msg-log-time{font-family:var(--font-mono);color:var(--text-dim);min-width:80px;flex-shrink:0;font-size:9px;}
.msg-log-sender{color:var(--accent);font-weight:600;min-width:110px;flex-shrink:0;}
.msg-log-body{flex:1;color:var(--text-secondary);}

/* Empty */
.empty{text-align:center;padding:40px;color:var(--text-dim);font-family:var(--font-mono);font-size:12px;}

/* Print */
@media print{
  body{background:#fff!important;color:#000!important;overflow:visible!important;}
  .report-toolbar,.btn{display:none!important;}
  .report{padding:0!important;max-width:none!important;}
  .report-cover{border-bottom-color:#1a4d8f!important;}
  .sec,.sec-hdr,.sec-body{background:#fff!important;border-color:#ccc!important;break-inside:avoid;}
  .sec-hdr{color:#1a4d8f!important;background:#f0f4f8!important;}
  *{color:#000!important;text-shadow:none!important;box-shadow:none!important;}
  .stat-num{color:#1a4d8f!important;}
  .unit-table th{background:#f0f4f8!important;color:#1a4d8f!important;}
  .card-desc,.msg-log-sender{color:#1a4d8f!important;}
  .card-meta .lbl{color:#1a4d8f!important;}
}
</style>
</head>
<body>

<div class="report" id="report">

  <!-- Cover -->
  <div class="report-cover" id="cover">
    <div class="logo-row">
      <img class="logo" src="icon-192.png" alt="OPM">
    </div>
    <h1 id="cover-title">Operations Report</h1>
    <div class="subtitle">O P E R A T I O N S &nbsp; P E R S O N N E L &nbsp; M O N I T O R</div>
    <div class="meta-row">
      <span><strong id="cover-unit">ALL UNITS</strong></span>
      <span><strong id="cover-date"></strong></span>
      <span><strong id="cover-event"></strong></span>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="report-toolbar">
    <label>UNIT:</label>
    <select class="select" id="f-unit" onchange="refresh()" style="width:auto;min-width:170px;"><option value="">ALL UNITS</option></select>
    <span style="color:var(--text-dim);margin:0 6px;">|</span>
    <label>FROM:</label><input type="date" id="f-from" onchange="refresh()">
    <label>TO:</label><input type="date" id="f-to" onchange="refresh()">
    <button class="btn btn-sm" onclick="document.getElementById('f-from').value='';document.getElementById('f-to').value='';refresh();">ALL TIME</button>
    <button class="btn btn-sm btn-success" onclick="setToday();">TODAY</button>
    <button class="btn btn-sm btn-warning" onclick="setThisWeek();">THIS WEEK</button>
    <span style="flex:1;"></span>
    <button class="btn btn-sm" onclick="window.print()">🖨 PRINT</button>
    <button class="btn btn-primary btn-sm" onclick="refresh()">🔄 REFRESH</button>
    <a class="btn btn-sm" href="commander.html">▶ COMMANDER</a>
    <a class="btn btn-sm" href="admin.html">⚙ ADMIN</a>
    <span id="last-upd" class="mono text-dim" style="font-size:9px;"></span>
  </div>

  <div class="report-body" id="report-body">
    <div class="sec"><div class="sec-body empty">⏳ Loading report...</div></div>
  </div>
</div>

<script src="opm-core.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
function fmtDT(v){return String(v||'').replace('T',' ');}
function extractLabeled(body,label){
  if(!body)return'';
  var r=new RegExp(label+':\\s*(.+?)(?:\\n|$)','i');
  var m=body.match(r);
  return m?m[1].trim():'';
}
function photoDescription(p){return p.photoDesc||p.description||extractLabeled(p.body,'Description')||'Photo report';}
function photoWhere(p){return p.photoWhere||extractLabeled(p.body,'Where')||p.post||'';}
function photoWhy(p){return p.photoWhy||extractLabeled(p.body,'Why/Purpose')||extractLabeled(p.body,'Why')||'';}
function photoCapture(p){return p.captureTime||extractLabeled(p.body,'Captured')||p.time||'';}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

var _chart=null;

function populateUnits(){
  var cfg=OPM.getConfig();var teams=Array.isArray(cfg.teams)?cfg.teams:[];
  var sel=document.getElementById('f-unit');var cur=sel.value;
  sel.innerHTML='<option value="">ALL UNITS</option>';
  teams.forEach(function(t){var o=document.createElement('option');o.value=t.name;o.textContent=t.name;if(t.name===cur)o.selected=true;sel.appendChild(o);});
}

function setToday(){var d=new Date().toISOString().substring(0,10);document.getElementById('f-from').value=d;document.getElementById('f-to').value=d;refresh();}
function setThisWeek(){var n=new Date(),day=n.getDay();var m=new Date(n);m.setDate(n.getDate()-(day===0?6:day-1));var s=new Date(m);s.setDate(m.getDate()+6);document.getElementById('f-from').value=m.toISOString().substring(0,10);document.getElementById('f-to').value=s.toISOString().substring(0,10);refresh();}

async function fetchData(){
  var url=OPM.SHEET_URL();if(!url)return null;
  var from=document.getElementById('f-from').value;
  var to=document.getElementById('f-to').value;
  try{
    var p=new URLSearchParams({action:'getDashboardData',t:Date.now()});
    if(from)p.set('dateFrom',from+' 00:00:00');
    if(to)p.set('dateTo',to+' 23:59:59');
    var r=await fetch(url+'?'+p,{cache:'no-store'});
    return await r.json();
  }catch(e){return null;}
}

async function refresh(){
  populateUnits();
  if(_chart){_chart.destroy();_chart=null;}
  document.getElementById('report-body').innerHTML='<div class="sec"><div class="sec-body empty">⏳ Loading report...</div></div>';
  var data=await fetchData();
  document.getElementById('last-upd').textContent='Updated: '+OPM.formatTime();

  var selUnit=document.getElementById('f-unit').value||'ALL UNITS';
  var df=document.getElementById('f-from').value||'beginning';
  var dt=document.getElementById('f-to').value||'present';
  var cfg=OPM.getConfig();

  document.getElementById('cover-title').textContent=(cfg.eventName||'Operations Report');
  document.getElementById('cover-unit').textContent=selUnit;
  document.getElementById('cover-date').textContent=df+' → '+dt;
  document.getElementById('cover-event').textContent=cfg.unit||cfg.location||'';

  if(!data||!data.summary||(data.summary.totalMessages===0&&data.summary.totalPersonnel===0)){
    document.getElementById('report-body').innerHTML='<div class="sec"><div class="sec-body empty">No data for <strong>'+selUnit+'</strong> on <strong>'+df+' → '+dt+'</strong><br><br><button class="btn btn-primary btn-sm" onclick="setToday();">TODAY</button> <button class="btn btn-warning btn-sm" onclick="setThisWeek();">THIS WEEK</button> <button class="btn btn-sm" onclick="document.getElementById(\'f-from\').value=\'\';document.getElementById(\'f-to\').value=\'\';refresh();">ALL TIME</button></div></div>';
    return;
  }

  build(data,selUnit,df,dt);
}

function build(data,selUnit,df,dt){
  var s=data.summary;
  var unitData=Array.isArray(data.unitData)?data.unitData:[];
  var photos=data.photos||[];
  var all=data.allMessages||[];
  var perTeam=data.personnelByTeam||{};
  var daily=data.dailyActivity||[];

  // Filter by unit
  if(selUnit!=='ALL UNITS'){
    unitData=unitData.filter(function(u){return u.team===selUnit;});
    photos=photos.filter(function(p){return p.team===selUnit;});
    all=all.filter(function(m){return m.team===selUnit;});
    var fpt={};if(perTeam[selUnit])fpt[selUnit]=perTeam[selUnit];perTeam=fpt;
  }

  var totalMsgs=unitData.reduce(function(a,u){return a+(u.messages||0);},0);
  var totalTasks=unitData.reduce(function(a,u){return a+(u.tasks||0);},0);
  var totalIncs=unitData.reduce(function(a,u){return a+(u.incidents||0);},0);
  var totalPhotos=unitData.reduce(function(a,u){return a+(u.photos||0);},0);
  var unitNames=unitData.map(function(u){return u.team;});
  var unitTasks=unitData.map(function(u){return u.tasks||0;});
  var unitPhotos=unitData.map(function(u){return u.photos||0;});

  var html='';

  // ── EXECUTIVE SUMMARY ────────────────────
  html+='<div class="sec"><div class="sec-hdr">📋 EXECUTIVE SUMMARY</div><div class="sec-body"><div class="stats-bar">';
  html+='<div class="stat-item"><div class="stat-num">'+totalMsgs+'</div><div class="stat-lbl">Communications</div></div>';
  html+='<div class="stat-item"><div class="stat-num" style="color:var(--success);">'+totalTasks+'</div><div class="stat-lbl">Tasks Accomplished</div></div>';
  html+='<div class="stat-item"><div class="stat-num">'+totalPhotos+'</div><div class="stat-lbl">Photo Reports</div></div>';
  html+='<div class="stat-item"><div class="stat-num" style="color:var(--warning);">'+totalIncs+'</div><div class="stat-lbl">Incidents Logged</div></div>';
  html+='<div class="stat-item"><div class="stat-num">'+(selUnit!=='ALL UNITS'?(perTeam[selUnit]||0):s.totalPersonnel)+'</div><div class="stat-lbl">'+(selUnit!=='ALL UNITS'?'Staff in Unit':'Personnel Deployed')+'</div></div>';
  html+='<div class="stat-item"><div class="stat-num" style="color:var(--success);">'+(selUnit!=='ALL UNITS'?(perTeam[selUnit]||0):s.onlineNow)+'</div><div class="stat-lbl">Currently Active</div></div>';
  html+='</div></div></div>';

  // ── UNIT PERFORMANCE TABLE ───────────────
  if(unitNames.length>0){
    html+='<div class="sec"><div class="sec-hdr">📊 UNIT PERFORMANCE BREAKDOWN<span style="font-size:8px;color:var(--text-dim);letter-spacing:0;">PERIOD: '+df+' → '+dt+'</span></div><div class="sec-body">';
    html+='<table class="unit-table"><thead><tr><th></th><th>UNIT / SECTOR</th><th class="num">TASKS</th><th class="num">PHOTOS</th><th class="num">INCIDENTS</th><th class="num">COMMS</th></tr></thead><tbody>';
    var colors=['#00e5ff','#00ff88','#ff6b35','#ffd166','#a29bfe','#fd79a8','#55efc4'];
    unitData.forEach(function(u,i){
      html+='<tr><td><span class="dot" style="background:'+(colors[i%7])+'"></span></td><td><strong>'+u.team+'</strong></td><td class="num" style="color:var(--success);">'+(u.tasks||0)+'</td><td class="num">'+(u.photos||0)+'</td><td class="num" style="color:'+(u.incidents>0?'var(--warning)':'var(--text-dim)')+';">'+(u.incidents||0)+'</td><td class="num">'+(u.messages||0)+'</td></tr>';
    });
    html+='</tbody></table>';
    // Bar chart for visual comparison
    html+='<div style="margin-top:16px;height:180px;"><canvas id="chart-perf"></canvas></div>';
    html+='</div></div>';
  }

  // ── PHOTO REPORT GALLERY ─────────────────
  if(photos.length>0){
    html+='<div class="sec"><div class="sec-hdr">📸 FIELD PHOTO REPORTS ('+photos.length+')</div><div class="sec-body">';
    html+='<div class="photo-report-grid">';
    photos.slice(0,20).forEach(function(p){
      var m=(p.url||'').match(/[?&]id=([a-zA-Z0-9_-]+)/);
      var embed=m?'https://lh3.googleusercontent.com/d/'+m[1]:p.url;
      var desc=photoDescription(p);
      var where=photoWhere(p);
      var why=photoWhy(p);
      var cap=photoCapture(p);
      html+='<div class="photo-report-card">';
      html+='<img src="'+esc(embed)+'" loading="lazy" onerror="this.parentElement.style.display=\'none\'" onclick="window.open(\''+esc(p.url)+'\')">';
      html+='<div class="card-info">';
      html+='<div class="card-desc">'+esc(desc)+'</div>';
      html+='<div class="card-meta">';
      if(where)html+='<span class="lbl">Location:</span><span class="val">'+esc(where)+'</span>';
      if(cap)html+='<span class="lbl">Captured:</span><span class="val">'+esc(fmtDT(cap))+'</span>';
      if(why)html+='<span class="lbl">Purpose:</span><span class="val">'+esc(why)+'</span>';
      html+='<span class="lbl">Unit:</span><span class="val" style="color:'+esc(colors[unitNames.indexOf(p.team)%7]||'var(--accent)')+';">'+esc(p.team||'')+'</span>';
      html+='<span class="lbl">By:</span><span class="val">'+esc(p.sender||'')+'</span>';
      html+='</div></div></div>';
    });
    html+='</div>';
    if(photos.length>20)html+='<div style="text-align:center;padding:12px;color:var(--text-dim);font-family:var(--font-mono);font-size:10px;">Showing 20 of '+photos.length+' photo reports</div>';
    html+='</div></div>';
  }

  // ── NARRATIVE ─────────────────────────────
  var narrativeAuto='During the reporting period ('+df+' to '+dt+'), the '+esc(selUnit)+' recorded '+totalMsgs+' communications, '+totalTasks+' task accomplishments, and '+totalPhotos+' photo reports from the field.\n\n';
  if(totalTasks>0)narrativeAuto+='A total of '+totalTasks+' tasks were accomplished across units, demonstrating active field operations and task completion tracking.\n';
  if(totalIncs>0)narrativeAuto+=totalIncs+' incidents were logged and documented, requiring appropriate command attention and follow-up actions.\n';
  else narrativeAuto+='No incidents were reported during this period, indicating smooth operations.\n';
  if(totalPhotos>0)narrativeAuto+=totalPhotos+' photo reports provide visual documentation of field conditions, accomplishments, and incidents. These photos serve as evidence of work completed and situations encountered.\n';
  if(daily.length>1)narrativeAuto+='Activity was recorded across '+daily.length+' day(s) during this period.\n';

  html+='<div class="sec"><div class="sec-hdr">📝 OPERATIONS NARRATIVE <span style="font-size:8px;color:var(--text-dim);letter-spacing:0;">✏️ EDITABLE</span></div><div class="sec-body">';
  html+='<textarea class="narrative-edit" id="narrative-text">'+esc(narrativeAuto)+'</textarea>';
  html+='<div class="flex gap-sm" style="margin-top:10px;">';
  html+='<button class="btn btn-success btn-sm" onclick="saveNarrative()">💾 SAVE</button>';
  html+='<button class="btn btn-sm" onclick="resetNarrative()">↺ RESET</button>';
  html+='<span id="nar-saved" style="display:none;font-family:var(--font-mono);font-size:10px;color:var(--success);align-self:center;">✓ SAVED</span>';
  html+='</div></div></div>';

  // ── MESSAGE LOG ──────────────────────────
  if(all.length>0){
    html+='<div class="sec"><div class="sec-hdr">📋 COMMUNICATIONS LOG ('+all.length+')</div><div class="sec-body">';
    html+='<div class="msg-log">';
    all.slice().reverse().slice(0,80).forEach(function(m){
      html+='<div class="msg-log-row"><span class="msg-log-time">'+esc((m.time||'').substring(0,19))+'</span><span class="msg-log-sender">'+esc(m.sender||'')+(m.team?' ['+esc(m.team)+']':'')+'</span><span class="msg-log-body">'+esc((m.body||'').substring(0,130))+(m.photo?' 📷':'')+'</span></div>';
    });
    html+='</div>';
    if(all.length>80)html+='<div style="text-align:center;padding:8px;color:var(--text-dim);font-family:var(--font-mono);font-size:10px;">Latest 80 of '+all.length+' messages</div>';
    html+='</div></div>';
  }

  document.getElementById('report-body').innerHTML=html;

  // Chart
  setTimeout(function(){
    var canvas=document.getElementById('chart-perf');
    if(canvas&&unitNames.length>0){
      _chart=new Chart(canvas,{type:'bar',data:{labels:unitNames,datasets:[
        {label:'Tasks',data:unitTasks,backgroundColor:colors.slice(0,unitNames.length),borderWidth:0,borderRadius:3},
        {label:'Photos',data:unitPhotos,backgroundColor:colors.slice(0,unitNames.length).map(function(c){return c+'66';}),borderWidth:0,borderRadius:3}
      ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#6a80b0',font:{family:'Share Tech Mono',size:10}}}},scales:{x:{ticks:{color:'#6a80b0',font:{size:9},maxRotation:45},grid:{color:'#1e326020'}},y:{ticks:{color:'#6a80b0',font:{size:9}},grid:{color:'#1e326030'},beginAtZero:true}}}});
    }

    // Load saved narrative
    var nt=document.getElementById('narrative-text');
    if(nt){_origNarrative=nt.value;var key='nar_'+selUnit.replace(/[^a-z0-9]/gi,'_')+'_'+(df||'any')+'_'+(dt||'any');var cfg=OPM.getConfig();if(cfg[key])nt.value=cfg[key];}
  },300);
}

var _origNarrative='';
function saveNarrative(){
  var nt=document.getElementById('narrative-text');if(!nt)return;
  var selUnit=document.getElementById('f-unit').value||'ALL UNITS';
  var df=document.getElementById('f-from').value||'any',dt=document.getElementById('f-to').value||'any';
  var key='nar_'+selUnit.replace(/[^a-z0-9]/gi,'_')+'_'+df+'_'+dt;
  var cfg=OPM.getConfig();cfg[key]=nt.value.trim();OPM.saveConfig(cfg);
  document.getElementById('nar-saved').style.display='inline';
  setTimeout(function(){document.getElementById('nar-saved').style.display='none';},2000);
}
function resetNarrative(){
  if(_origNarrative)document.getElementById('narrative-text').value=_origNarrative;
}

document.addEventListener('DOMContentLoaded',function(){populateUnits();setToday();});
